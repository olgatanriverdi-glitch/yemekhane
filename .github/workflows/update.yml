name: Menüleri güncelle
on:
  schedule:
    - cron: "0 3,9,15 * * *"     # günde 3 kez (UTC): sabah 06:00, 12:00, 18:00 Türkiye saati
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Bağımlılıklar (görsel okuma + fotoğraf küçültme)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-tur
          pip install pillow
      - name: Testler
        run: cd scraper && python -m unittest discover -s tests -t .
      - name: Menüleri çek
        run: cd scraper && python -m yemekhane.build
      - name: Değişiklik varsa yayınla
        run: |
          git config user.name "yemekhane-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Menüler güncellendi"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push başarısız, tekrar deneniyor ($i)"; sleep 5
          done
          exit 1
