name: Menüleri güncelle
on:
  schedule:
    - cron: "17 3,9,15 * * *"     # günde 3 kez (UTC): 06:17, 12:17, 18:17 Türkiye saati (tam saat GitHub'da en yoğun dakika)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Bağımlılıklar (TLS kökleri + görsel okuma + fotoğraf küçültme)
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq tesseract-ocr tesseract-ocr-tur
          pip install pillow certifi
      - name: Testler
        run: |
          cd scraper
          python -m unittest discover -s tests -t . || { echo "::warning::Testler bir kez düştü; yeniden deneniyor"; python -m unittest discover -s tests -t .; }
      - name: Menüleri çek
        run: cd scraper && python -m yemekhane.build
      - name: Uygulamanın çevrimdışı paket verisini eşitle
        run: cd scraper && python -m yemekhane.esitle
      - name: Değişiklik varsa yayınla
        run: |
          git config user.name "yemekhane-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3; do
            git add data app/assets/data
            if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
            git commit -q -m "Menüler güncellendi"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push reddedildi (main ilerlemiş); main'in son hâliyle yeniden hesaplanıyor ($i)"
            git fetch -q origin main
            git reset -q --hard origin/main
            (cd scraper && python -m yemekhane.build && python -m yemekhane.esitle) || exit 1
          done
          exit 1
