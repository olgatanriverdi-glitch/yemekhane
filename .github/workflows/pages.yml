name: Siteyi yayınla
on:
  push:
    branches: [main]
    paths: ["app/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter web derle
        run: |
          cd app
          flutter pub get
          flutter build web --release --base-href /yemekhane/app/
      - name: Siteyi birleştir
        run: |
          mkdir -p out
          cp -R site/. out/
          cp -R app/build/web out/app
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
