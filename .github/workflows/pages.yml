name: Siteyi yayınla
on:
  push:
    branches: [main]
    paths: ["app/**", "site/**", ".github/workflows/pages.yml"]
  # GITHUB_TOKEN ile yapılan robot push'u başka bir push işini tetiklemez.
  workflow_run:
    workflows: ["Menüleri güncelle"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  derle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha robotun veri commit'inden öncedir; güncel main'i al.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      # Flutter sürümü sabit: "stable" kanalı kendiliğinden yükselince web derlemesi habersiz değişmesin. Yerelde
      # `flutter --version` ile aynı olmalı; yükseltirken yerelde `flutter build web` deneyip sonra burayı güncelle.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Flutter web derle
        run: |
          cd app
          flutter pub get
          flutter build web --release --base-href /yemekhane/app/
      - name: Siteyi birleştir
        run: |
          mkdir -p out
          cp -R site/. out/
          cp -R app/build/web out/app
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
