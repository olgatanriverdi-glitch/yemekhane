<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Üniversite yemekhane menüleri: öğle, akşam ve vejetaryen. Kalori ve öğrenci fiyatıyla, her gün güncel.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tarayıcı çubuğu rengi: Safran temasının yüzey rengi (açık #F6F3EE, koyu #1C170F); tema.dart ile aynı -->
  <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C170F" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="Üni Yemek">
  <meta property="og:description" content="Bugün yemekhanede ne var? Öğle, akşam ve vejetaryen menü.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Üni Yemek">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Üni Yemek – bugün ne var?</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Flutter ilk kareyi çizene kadar görünen zemin; uygulamanın Safran temasındaki yüzey rengiyle aynı,
       böylece açılışta açık/koyu flaş olmaz. Sistem koyuysa koyu zemin kullanılır. */
    html, body { margin: 0; background: #F6F3EE; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1C170F; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
