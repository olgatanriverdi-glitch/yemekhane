    <script type="text/javascript">
        $(document).ready(function () {
            $.fn.datepicker.defaults.language = 'tr';


            validateButton();
            function getUrlVars() {
                var href = $("#btnGoster").attr("href");
                var vars = [], hash;
                var hashes = href.slice(href.indexOf('?') + 1).split('&&');
                for (var i = 0; i < hashes.length; i++) {
                    hash = hashes[i].split('=');
                    vars.push(hash[0]);
                    vars[hash[0]] = hash[1];
                }
                return vars;
            }
            
            var tip = getUrlVars()["tip"];
            var value = getUrlVars()["value"];

            $("#btnGoster").attr("href", "https://bidb.itu.edu.tr/ExternalPages/sks/yemek-menu-v2/uzerinde-calisilan/yemek-menu.aspx?tip=" + tip + "&&value=" + value);

            $('.js-nyro-modal').nyroModal({
                showCloseButton: false,
                sizes: {
                    minW: 620
                }
            });

            $('.js-nutritional-values').nyroModal({
                showCloseButton: false,
                sizes: {
                    initW: 620,	// Initial width
                    initH: 300,	// Initial height
                    minW: 620,	// minimum width
                    minH: 530,	// minimum height
                    maxW: 690,	// maximum width
                    maxH: 600,	// maximum height
                    wMargin: 0,	// Horizontal margin
                    hMargin: 0 // Vertical margin
                }
            }).resize();
			
		
        });

        function validateButton() {
            debugger;
            var yemektip = $("#ddlYemekTipi").val();
            var value = $("#datepicker").val();

            if(yemektip == "-1" || value == "")
            {
                $("#btnGoster").attr("disabled", 'disabled');
            }
            else {
                $("#btnGoster").removeAttr("disabled");
            }
        }
        

    </script>

    <script type="text/javascript">

        $("#datepicker").datepicker({
            todayHighlight: 'FALSE',
            autoclose: true
        });

        $('#ddlYemekTipi').change(function () {
            
            editLink();
            validateButton();
        });

        $('#datepicker').change(function () {
            $('#hfDate').attr('value', $('#datepicker').val());
            editLink();
            validateButton();
        });

        function editLink() {
            var tip = getUrlVars()["tip"];
            var value = getUrlVars()["value"];

            tip = $('#ddlYemekTipi :selected').val();
            value = $("#datepicker").val();

            $("#hfDate").val(value);
            $("#hfYemekTipi").val(tip);

            $("#btnGoster").attr("href", "https://bidb.itu.edu.tr/ExternalPages/sks/yemek-menu-v2/uzerinde-calisilan/yemek-menu.aspx?tip=" + tip + "&&value=" + value);
        }

        function getUrlVars() {
            var href = $("#btnGoster").attr("href");
            var vars = [], hash;
            var hashes = href.slice(href.indexOf('?') + 1).split('&&');
            for (var i = 0; i < hashes.length; i++) {
                hash = hashes[i].split('=');
                vars.push(hash[0]);
                vars[hash[0]] = hash[1];
            }
            return vars;
        }
    </script>
